<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<script>
			// Hold the entrance animations until the two text fonts are in, so the fallback font
			// never shows mid-entrance and then swaps. Capped so a slow font can't hide the page.
			(function () {
				var root = document.documentElement;
				root.classList.add('fonts-pending');
				var done = function () {
					root.classList.remove('fonts-pending');
				};
				Promise.race([
					Promise.all([
						document.fonts.load('900 32px "Doto Variable"'),
						document.fonts.load('17px "Google Sans Flex Variable"')
					]),
					new Promise(function (resolve) {
						setTimeout(resolve, 1200);
					})
				]).then(done, done);
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
