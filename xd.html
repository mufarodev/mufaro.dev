<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#000000"/>
  
  <!-- Contour lines group -->
  <g id="contours" fill="none" filter="url(#glow)"/>
  
  <!-- Center point indicator -->
  <circle cx="400" cy="300" r="4" fill="#ffeb3b"/>
  
  <!-- Instructions -->
  <text x="400" y="30" font-size="18" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">
    Move Mouse to Generate Contours
  </text>
  <text x="400" y="560" font-size="12" fill="#aaaaaa" text-anchor="middle" font-family="Arial, sans-serif">
    X: <tspan id="xVal">0</tspan> | Y: <tspan id="yVal">0</tspan>
  </text>
  
  <script type="text/javascript">
    const svg = document.querySelector('svg');
    const contoursGroup = document.getElementById('contours');
    const xVal = document.getElementById('xVal');
    const yVal = document.getElementById('yVal');
    
    function seededRandom(x, y, seed) {
      const s = Math.sin(x * 12.9898 + y * 78.233 + seed * 45.164) * 43758.5453;
      return s - Math.floor(s);
    }
    
    function perlin(x, y, seed) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      
      const n00 = seededRandom(xi, yi, seed);
      const n10 = seededRandom(xi + 1, yi, seed);
      const n01 = seededRandom(xi, yi + 1, seed);
      const n11 = seededRandom(xi + 1, yi + 1, seed);
      
      const nx0 = n00 * (1 - u) + n10 * u;
      const nx1 = n01 * (1 - u) + n11 * u;
      
      return nx0 * (1 - v) + nx1 * v;
    }
    
    function generateContours(centerX, centerY) {
      contoursGroup.innerHTML = '';
      
      const seed = Math.floor(centerX * 73856093) ^ Math.floor(centerY * 19349663);
      const numContours = 40;
      const maxRadius = 400;
      
      for (let level = 1; level <= numContours; level++) {
        const radius = (level / numContours) * maxRadius;
        const points = [];
        const segments = Math.max(200, Math.floor(radius * 0.6));
        
        for (let i = 0; i <= segments; i++) {
          const angle = (i / segments) * Math.PI * 2;
          
          // Base circular position
          let x = centerX + Math.cos(angle) * radius;
          let y = centerY + Math.sin(angle) * radius;
          
          // Multi-octave noise for smooth organic deformation
          let totalNoise = 0;
          let amplitude = 1;
          let frequency = 1;
          let maxAmplitude = 0;
          
          for (let octave = 0; octave < 3; octave++) {
            const nx = perlin(x * 0.02 * frequency, y * 0.02 * frequency, seed + octave * 100);
            const ny = perlin(x * 0.02 * frequency + 500, y * 0.02 * frequency + 500, seed + octave * 100 + 1);
            
            totalNoise += (nx - 0.5) * amplitude;
            maxAmplitude += amplitude;
            
            amplitude *= 0.5;
            frequency *= 2;
          }
          
          // Apply smooth deformation
          const deform = (level / numContours) * 25;
          x += (totalNoise / maxAmplitude) * deform;
          y += (totalNoise / maxAmplitude) * deform;
          
          // Radial perturbation for irregular edges
          const radialNoise = perlin(angle * 5, level * 0.1, seed + 2);
          const radialOffset = (radialNoise - 0.5) * (level / numContours) * 12;
          x += Math.cos(angle) * radialOffset;
          y += Math.sin(angle) * radialOffset;
          
          points.push([x, y]);
        }
        
        // Create smooth cubic bezier path using Catmull-Rom interpolation
        let pathData = `M ${points[0][0]} ${points[0][1]}`;
        
        for (let i = 1; i < points.length - 2; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const p2 = points[i + 1];
          const p3 = points[i + 2];
          
          const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
          const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
          const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
          const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
          
          pathData += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2[0]} ${p2[1]}`;
        }
        pathData += ' Z';
        
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        
        const hue = 160 + (level / numContours) * 80;
        const saturation = 70 + (level / numContours) * 30;
        const lightness = 50 - (level / numContours) * 15;
        
        path.setAttribute('stroke', `hsl(${hue}, ${saturation}%, ${lightness}%)`);
        path.setAttribute('stroke-width', 1 + (level / numContours) * 1.5);
        path.setAttribute('opacity', 0.7 + (level / numContours) * 0.25);
        
        contoursGroup.appendChild(path);
      }
    }
    
    function handleInput(e) {
      const rect = svg.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const svgX = (x / rect.width) * 800;
      const svgY = (y / rect.height) * 600;
      
      xVal.textContent = Math.round(svgX);
      yVal.textContent = Math.round(svgY);
      
      generateContours(svgX, svgY);
    }
    
    svg.addEventListener('mousemove', handleInput);
    
    // Generate initial contours at center
    generateContours(400, 300);
  </script>
</svg>
